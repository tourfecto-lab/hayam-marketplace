{% load static %}<!doctype html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
  <meta name="htmx-config" content='{"allowEval":false,"includeIndicatorStyles":false}'>
  <title>{% block title %}هيام | لبس يليق بيكي{% endblock %}</title>
  <meta name="description" content="عبايات وإسدالات وملابس بيت ومقاسات كبيرة من هيام. تسوقي بسهولة بالجنيه المصري.">
  <meta property="og:title" content="{% block og_title %}هيام | لبس يليق بيكي{% endblock %}">
  <meta property="og:description" content="اختيارات مريحة لكل يوم ومقاسات تناسبك.">
  <meta property="og:type" content="website">
  <link rel="stylesheet" href="{% static 'app.css' %}">
  <script src="{% static 'vendor/htmx.min.js' %}" defer></script>
</head>
<body class="bg-stone-50 text-stone-900">
  <a href="#main" class="skip-link">روحي للمحتوى</a>
  <div class="bg-stone-900 text-stone-50 text-center p-2 text-sm">ستايل مريح، وتفاصيل تليق بيكي — الدفع عند الاستلام</div>
  <header class="border-b border-stone-200 bg-white">
    <nav aria-label="القائمة الرئيسية" class="max-w-6xl mx-auto px-5 py-5 flex items-center justify-between gap-4">
      <a href="{% url 'catalog' %}" class="text-3xl font-bold tracking-wide">هيام<span class="text-xs block font-normal">HAYAM COLLECTION</span></a>
      <a href="{% url 'catalog' %}" class="text-sm">كل المنتجات</a>
      <a href="{% url 'cart' %}" class="rounded-full border border-stone-300 px-5 py-2">شنطة التسوق</a>
    </nav>
  </header>
  <main id="main" class="max-w-6xl mx-auto px-5 py-8">{% block content %}{% endblock %}</main>
  <footer class="border-t border-stone-200 mt-12 p-8 text-center text-sm text-stone-600">هيام — اختاري براحتك. كل الأسعار بالجنيه المصري.</footer>
</body></html>
